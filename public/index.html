<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Deutsch Party</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="shell">
      <div class="topbar">
        <div class="topbar-inner">
          <div class="logo-gear">🎯</div>
          <div class="brand">
            <h1>Deutsch Party</h1>
            <p data-i18n="subtitle">Mehrspieler-Deutschquiz</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title" data-i18n="selectRole">ROLLE WÄHLEN</div>
          <div class="card-sub" data-i18n="selectRoleSub">Trete einem Spiel bei oder erstelle deinen eigenen Raum</div>
        </div>
        <div class="card-body">
          <div class="btn-row" style="display: flex; gap: 16px; justify-content: center;">
            <a href="/host.html" class="btn primary" style="flex: 1; text-align: center; text-decoration: none;" data-i18n="iAmHost">Ich bin Host</a>
            <a href="/player.html" class="btn" style="flex: 1; text-align: center; text-decoration: none;" data-i18n="iAmPlayer">Ich bin Spieler</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
  <div class="hud-signature">
    <span class="sig-text">by Yaroslav Zhuravskyi © 2026</span>
    <a class="sig-ig" href="https://instagram.com/delta.yarick" target="_blank" rel="noopener">inst @delta.yarick</a>
  </div>
</html>
